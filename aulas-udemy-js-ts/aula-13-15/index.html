<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício - Aula 13</title>
</head>
<body>
    
    <script>
        const nome = prompt('Qual é o seu nome completo?');
        document.body.innerHTML += `Olá, <strong>${nome}</strong>! Seu nome tem <strong>${nome.length}</strong> letras.`;
        document.body.innerHTML += `<br>Seu nome em maiúsculas é <strong>${nome.toUpperCase()}</strong>.`;
        document.body.innerHTML += `<br>Seu nome em minúsculas é <strong>${nome.toLowerCase()}</strong>.`;
        document.body.innerHTML += `<br>A primeira letra do seu nome é <strong>${nome[0]}</strong>.`;
        document.body.innerHTML += `<br>A última letra do seu nome é <strong>${nome[nome.length - 1]}</strong>.`;
        document.body.innerHTML += `<br>O primeiro índice da letra "a" no seu nome é <strong>${nome.indexOf('a')}</strong>.`;
    </script>
</body>
</html>

<!--
window é a janela do navegador e o document é o objeto que representa o documento HTML.
DOM = Document Object Model, é a interface de programação para documentos HTML e XML. Ele representa a página para que programas possam alterar a estrutura do documento, estilo e conteúdo. O DOM fornece uma representação estruturada do documento como uma árvore de nós e objetos; dessa forma, os desenvolvedores podem manipular o conteúdo, estrutura e estilo do documento.
-->
<!--innerHTML é a propriedade que permite acessar e modificar o conteúdo HTML de um elemento -->
